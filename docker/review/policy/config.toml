# Generated by autoreview-bot for each Codex review run.
# shell_environment_policy applies to agent-spawned commands only;
# Codex itself still authenticates with CODEX_API_KEY in its process env.
# inherit=core keeps PATH (required for codex-linux-sandbox helpers);
# do not set PATH here - it drops the arg0 helper prefix and breaks bwrap.

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.set]
    LANG = "C.UTF-8"
    TERM = "dumb"

[analytics]
enabled = false
