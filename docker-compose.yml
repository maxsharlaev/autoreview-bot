services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: review
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  migrate:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://review:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/review"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      context: .
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://review:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/review"
      REDIS_URL: redis://redis:6379/0
      OPEN_PR_REVIEW_SERVICE: api
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  worker:
    build:
      context: .
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://review:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/review"
      REDIS_URL: redis://redis:6379/0
      OPEN_PR_REVIEW_SERVICE: worker
      METRICS_PORT: "9100"
      LAUNCHER_URL: http://launcher:8080
      LAUNCHER_TOKEN: "${LAUNCHER_TOKEN:-}"
      OPR_CHECKOUT_BASE: /var/opr/checkouts
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./prompts:/app/prompts:ro
      - opr_checkouts:/var/opr/checkouts
    # Metrics stay on the Docker network (no host port), so `--scale worker=N` works.
    # Scrape every replica by service DNS name; see observability/prometheus-scrape.yml.
    expose:
      - "9100"
    # Docker's default seccomp/AppArmor block bubblewrap (CLONE_NEWUSER). Codex
    # still sandboxes itself with bwrap; this only relaxes the outer profile.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

  launcher:
    build:
      context: .
      dockerfile: Dockerfile.launcher
    env_file:
      - .env
    environment:
      LAUNCHER_TOKEN: "${LAUNCHER_TOKEN:?Set LAUNCHER_TOKEN in .env (shared with worker)}"
      OPR_CHECKOUT_BASE: /var/opr/checkouts
      OPR_REVIEW_IMAGE: opr-review:local
      OPR_REVIEW_NETWORK: autoreview_review_egress
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # High trust: this is the only service that mounts the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - opr_checkouts:/var/opr/checkouts
    expose:
      - "8080"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  opr_checkouts:

networks:
  default:
    name: autoreview_default
  internal:
    name: autoreview_internal
  review_egress:
    name: autoreview_review_egress
    # MVP: internet-capable for the model API; not attached to postgres/redis/api.
    # Strict egress allowlist arrives with the M3 model-API proxy.
