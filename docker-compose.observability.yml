# Opt-in dev Prometheus and Grafana on the stack's Docker network. Not for production.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
# Prometheus: http://127.0.0.1:9090 (targets: /targets, alerts: /alerts).
# Grafana: http://127.0.0.1:3000 (anonymous viewer; admin login is local-only, see docs/OBSERVABILITY.md).
# Data is kept in tmpfs only.
services:
  prometheus:
    image: prom/prometheus:v3.7.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-scrape.yml:/etc/prometheus/scrape.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    tmpfs:
      - /prometheus:mode=1777 # Prometheus runs as nobody
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      # Local-only dev default; set GRAFANA_ADMIN_PASSWORD to override.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autoreview-bot.json
    volumes:
      - ./observability/dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:mode=1777,exec # Grafana runs as uid 472; plugins need exec
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
