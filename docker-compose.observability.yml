# Opt-in dev Prometheus, Grafana, Loki and Alloy on the stack's Docker network. Not for production.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
# Prometheus: http://127.0.0.1:9090 (targets: /targets, alerts: /alerts).
# Grafana: http://127.0.0.1:3000 (anonymous viewer; admin login is local-only, see docs/OBSERVABILITY.md).
# Loki has no host port; Alloy ships this project's container logs to it via docker-socket-proxy.
# Data is kept in tmpfs only.
services:
  prometheus:
    image: prom/prometheus:v3.7.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus-scrape.yml:/etc/prometheus/scrape.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    tmpfs:
      - /prometheus:mode=1777 # Prometheus runs as nobody
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      # Local-only dev default; set GRAFANA_ADMIN_PASSWORD to override.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autoreview-bot.json
    volumes:
      - ./observability/dev/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:mode=1777,exec # Grafana runs as uid 472; plugins need exec
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/dev/loki.yml:/etc/loki/loki.yml:ro
    tmpfs:
      - /loki:size=512m,mode=1777 # Loki runs as uid 10001; cap keeps retention failures bounded
    expose:
      - "3100"

  # Only this service mounts the Docker socket. Alloy reaches it over the
  # internal docker_proxy network; :ro on the socket is not an API boundary.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1" # GET container list/inspect/logs (what Alloy needs)
      NETWORKS: "1" # GET networks; Alloy discovery needs this for network labels
      POST: "0" # no create/start/stop/exec or other mutating methods
      EXEC: "0"
      IMAGES: "0"
      VOLUMES: "0"
      INFO: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy
    # No host ports; only Alloy shares docker_proxy.

  alloy:
    image: grafana/alloy:v1.21.2
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      # Only containers of this Compose project are collected.
      COMPOSE_PROJECT: "${COMPOSE_PROJECT_NAME}"
    volumes:
      - ./observability/dev/alloy.alloy:/etc/alloy/config.alloy:ro
    tmpfs:
      - /var/lib/alloy:mode=1777
    depends_on:
      - loki
      - docker-socket-proxy
    networks:
      - default
      - docker_proxy

networks:
  docker_proxy:
    internal: true
