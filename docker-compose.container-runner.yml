# Opt-in overlay for codex.runner_backend: container (not loaded by default CI/`docker compose`).
# Usage:
#   docker build -f Dockerfile.review -t opr-review:local .
#   # set LAUNCHER_TOKEN / PROXY_ISSUER_TOKEN in .env (openssl rand -hex 32), then:
#   docker compose -f docker-compose.yml -f docker-compose.container-runner.yml up -d --build
# LAUNCHER_TOKEN / PROXY_ISSUER_TOKEN use non-required interpolation (${VAR:-}) so this file can be
# parsed without the vars; launcher / model-proxy fail closed if empty when used.
# model-proxy holds real model keys via model-proxy.env (env_file) + listed knobs; no Docker socket. Worker/launcher must not mount model-proxy.env.
services:
  worker:
    environment:
      LAUNCHER_URL: http://launcher:8080
      LAUNCHER_TOKEN: "${LAUNCHER_TOKEN:-}"
      PROXY_ISSUER_TOKEN: "${PROXY_ISSUER_TOKEN:-}"
      MODEL_PROXY_URL: "${MODEL_PROXY_URL:-http://model-proxy:8081}"
      OPR_PROXY_FINISH_REVOKE_TIMEOUT_SECONDS: "${OPR_PROXY_FINISH_REVOKE_TIMEOUT_SECONDS:-2}"
      OPR_CHECKOUT_BASE: /var/opr/checkouts
      OPR_CHECKOUT_VOLUME: opr_checkouts
      OPR_MAX_REVIEW_TIMEOUT_SECONDS: "${OPR_MAX_REVIEW_TIMEOUT_SECONDS:-600}"
      OPR_CLONE_TIMEOUT_SECONDS: "${OPR_CLONE_TIMEOUT_SECONDS:-300}"
      OPR_CHECKOUT_ORPHAN_TTL_SECONDS: "${OPR_CHECKOUT_ORPHAN_TTL_SECONDS:-900}"
      OPR_LEASE_HEARTBEAT_SECONDS: "${OPR_LEASE_HEARTBEAT_SECONDS:-30}"
    volumes:
      - opr_checkouts:/var/opr/checkouts
    depends_on:
      launcher:
        condition: service_started

  launcher:
    build:
      context: .
      dockerfile: Dockerfile.launcher
    # No env_file: .env would inject worker/DB/model secrets into the socket holder.
    # Compose still reads host/.env for ${LAUNCHER_TOKEN:-} interpolation only.
    environment:
      LAUNCHER_TOKEN: "${LAUNCHER_TOKEN:-}"
      OPR_CHECKOUT_BASE: /var/opr/checkouts
      OPR_CHECKOUT_VOLUME: opr_checkouts
      OPR_REVIEW_IMAGE: opr-review:local
      OPR_REVIEW_NETWORK: autoreview_review_egress
      LAUNCHER_APPARMOR_PROFILE: "${LAUNCHER_APPARMOR_PROFILE:-unconfined}"
      LAUNCHER_CANCEL_WAIT_SECONDS: "${LAUNCHER_CANCEL_WAIT_SECONDS:-3}"
      LAUNCHER_CANCEL_DEADLINE_SECONDS: "${LAUNCHER_CANCEL_DEADLINE_SECONDS:-4}"
      LAUNCHER_CANCEL_REVOKE_TIMEOUT_SECONDS: "${LAUNCHER_CANCEL_REVOKE_TIMEOUT_SECONDS:-2}"
      LAUNCHER_CANCEL_REVOKE_MAX_PENDING: "${LAUNCHER_CANCEL_REVOKE_MAX_PENDING:-32}"
      OPR_MAX_REVIEW_TIMEOUT_SECONDS: "${OPR_MAX_REVIEW_TIMEOUT_SECONDS:-600}"
      OPR_CLONE_TIMEOUT_SECONDS: "${OPR_CLONE_TIMEOUT_SECONDS:-300}"
      OPR_CHECKOUT_ORPHAN_TTL_SECONDS: "${OPR_CHECKOUT_ORPHAN_TTL_SECONDS:-900}"
      OPR_LEASE_HEARTBEAT_SECONDS: "${OPR_LEASE_HEARTBEAT_SECONDS:-30}"
      OPR_REVIEW_ORPHAN_TTL_SECONDS: "${OPR_REVIEW_ORPHAN_TTL_SECONDS:-7200}"
      OPR_REVIEW_REAPER_INTERVAL_SECONDS: "${OPR_REVIEW_REAPER_INTERVAL_SECONDS:-300}"
      PROXY_ISSUER_TOKEN: "${PROXY_ISSUER_TOKEN:-}"
      MODEL_PROXY_URL: "${MODEL_PROXY_URL:-http://model-proxy:8081}"
      OPR_MODEL_PROXY_BASE_URL: "${OPR_MODEL_PROXY_BASE_URL:-http://model-proxy:8081/v1}"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # High trust: this is the only service that mounts the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
      - opr_checkouts:/var/opr/checkouts
    expose:
      - "8080"
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
      model-proxy:
        condition: service_started

  model-proxy:
    build:
      context: .
      dockerfile: Dockerfile.model-proxy
    # Real model keys live only here (M3). env_file injects arbitrary names from
    # PROXY_OWNER_KEY_ENVS (e.g. ORG_A_HYPHEN_KEY) that Compose `environment:` cannot
    # list ahead of time. Worker/launcher must NOT set env_file to model-proxy.env.
    # Restrict file perms (chmod 600 / Windows ACLs). Copy from model-proxy.env.example.
    # `required: false` so CI/parse works before the file exists; create it before up.
    env_file:
      - path: model-proxy.env
        required: false
    # No Docker socket. Listed keys below are non-secret knobs only.
    # Do NOT list OPENAI_API_KEY / PROXY_OWNER_KEY_ENVS here: Compose `environment`
    # overrides `env_file`, which would empty them when host env is unset (ARB34-006).
    # Put those (and any PROXY_OWNER_KEY_ENVS-named vars) only in model-proxy.env.
    environment:
      PROXY_ISSUER_TOKEN: "${PROXY_ISSUER_TOKEN:-}"
      PROXY_PROVIDER: "${PROXY_PROVIDER:-openai}"
      PROXY_UPSTREAM_HOST: "${PROXY_UPSTREAM_HOST:-api.openai.com}"
      PROXY_UPSTREAM_SCHEME: "${PROXY_UPSTREAM_SCHEME:-https}"
      OPR_MAX_REVIEW_TIMEOUT_SECONDS: "${OPR_MAX_REVIEW_TIMEOUT_SECONDS:-600}"
      PROXY_TOKEN_GRACE_SECONDS: "${PROXY_TOKEN_GRACE_SECONDS:-60}"
      PROXY_MAX_BODY_BYTES: "${PROXY_MAX_BODY_BYTES:-4194304}"
      PROXY_MAX_REQUESTS_PER_JOB: "${PROXY_MAX_REQUESTS_PER_JOB:-50}"
      PROXY_MAX_BYTES_PER_JOB: "${PROXY_MAX_BYTES_PER_JOB:-16777216}"
      PROXY_MAX_CONCURRENT_PER_JOB: "${PROXY_MAX_CONCURRENT_PER_JOB:-2}"
      PROXY_STREAM_IDLE_TIMEOUT_SECONDS: "${PROXY_STREAM_IDLE_TIMEOUT_SECONDS:-300}"
      PROXY_UPSTREAM_TIMEOUT_SECONDS: "${PROXY_UPSTREAM_TIMEOUT_SECONDS:-660}"
    expose:
      - "8081"
    networks:
      - internal
      - review_egress
      - proxy_egress

volumes:
  opr_checkouts:
    name: opr_checkouts

networks:
  review_egress:
    name: autoreview_review_egress
    # Review containers + model-proxy only (no external routes). Containers cannot
    # reach the public internet; they talk to model-proxy by Compose DNS.
    internal: true
  proxy_egress:
    name: autoreview_proxy_egress
    # model-proxy alone uses this network to reach the upstream model API.
    # Host firewall / cloud SG should still restrict egress to the upstream host.
