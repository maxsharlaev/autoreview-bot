# Snippets for an *existing* Prometheus. Do not run Prometheus from this repo.
# Merge `scrape_configs` and load `alerts.yml` as a rule file.
# Replace targets with localhost:8000 / localhost:9100 if you scrape published host ports.

scrape_configs:
  - job_name: open-pr-review-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: open-pr-review-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker
