# Snippets for an *existing* Prometheus (the dev overlay docker-compose.observability.yml also loads this file).
# Merge `scrape_configs` and load `alerts.yml` as a rule file.
# Prometheus must be on the same Docker network as the stack (or reach it another way).
# The API port is published on 127.0.0.1:8000, so a Prometheus on the host can use localhost:8000.
# The worker port is not published: the worker job resolves the `worker` service name, which
# returns one address per replica, so `docker compose up --scale worker=N` is scraped fully.
# Docker Swarm: use `tasks.worker` instead of `worker`.

scrape_configs:
  - job_name: open-pr-review-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: open-pr-review-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
    relabel_configs:
      - target_label: service
        replacement: worker

  - job_name: open-pr-review-model-proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["model-proxy:8081"]
        labels:
          service: model-proxy

