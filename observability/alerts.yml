groups:
  - name: open-pr-review
    rules:
      - alert: OpenPrReviewWorkerDown
        # `absent` covers a Prometheus that never discovered a worker. When every worker stops, the
        # `worker` name stops resolving and Prometheus keeps the last targets at up == 0, so `max == 0` covers that.
        expr: absent(up{job="open-pr-review-worker"}) or max(up{job="open-pr-review-worker"}) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: No worker is running
          description: No worker replica is discovered, or every known worker target is down (for example all workers stopped, DNS no longer resolves and Prometheus keeps the last target at up == 0). Reviews will queue and never run.

      - alert: OpenPrReviewWorkerTargetDown
        expr: up{job="open-pr-review-worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Worker metrics target unreachable
          description: A discovered worker replica cannot be scraped, which may mean lost review capacity; other replicas may still process reviews. Known limitation - a replica that stops drops out of Docker DNS discovery, so partial loss of replicas is not detected by this alert; use Docker/orchestrator desired-vs-running metrics for that (a queue-backlog alert is planned).

      - alert: OpenPrReviewApiDown
        expr: up{job="open-pr-review-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: API metrics endpoint is down

      - alert: OpenPrReviewCodexQuota
        expr: increase(open_pr_review_codex_attempts_total{result="CODEX_QUOTA"}[15m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: OpenAI quota exhausted
          description: Codex returned CODEX_QUOTA. Top up https://platform.openai.com/settings/organization/billing/ — reviews will keep failing.

      - alert: OpenPrReviewQueueNotDraining
        expr: max(open_pr_review_arq_queue_jobs) > 0 and max(open_pr_review_review_in_flight{status="running"}) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Jobs queued but no worker is running them
          description: ARQ has waiting jobs and zero running review_runs. Check worker logs and `docker compose ps worker`.

      - alert: OpenPrReviewStaleReviews
        expr: max(open_pr_review_review_stale_in_flight) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Review runs stuck in pending/running
          description: One or more review_runs have not updated for 15+ minutes. Worker crash, Codex hang, or dead ARQ job.

      - alert: OpenPrReviewModelProxyDown
        # in_process sets open_pr_review_model_proxy_expected to 0. Absence or a dead
        # scrape target is then normal: that deployment has no model-proxy.
        # absent() keeps the job label; max() does not. on() matches the two anyway.
        expr: (absent(up{job="open-pr-review-model-proxy"}) or max(up{job="open-pr-review-model-proxy"}) == 0) and on() max(open_pr_review_model_proxy_expected) == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: model-proxy is not being scraped
          description: This deployment expects model-proxy, and Prometheus has no target or every known target is down. An in-process deployment sets open_pr_review_model_proxy_expected to 0 and does not page. This is process liveness, not model health. An HTTP 401 from the provider only shows that the network path works. See docs/TROUBLESHOOTING.md#model-proxy-connectivity.

      - alert: OpenPrReviewModelProxyConsecutiveFailures
        expr: max(model_proxy_consecutive_upstream_failures) >= 3
        for: 2m
        labels:
          severity: page
        annotations:
          summary: Model provider connection is failing
          description: Three or more real model attempts in a row failed on timeout, transport, upstream 5xx, or a broken stream. A completed provider response that is not one of those resets the streak, including auth, quota, rate limit, other 4xx, and a finished incomplete or failed response. That reset is not a successful model call. The gauge also resets to 0 when model-proxy restarts. No traffic does not fire it. See docs/TROUBLESHOOTING.md#model-proxy-connectivity.

      - alert: OpenPrReviewModelProxyFailureRatio
        expr: (sum(increase(model_proxy_model_attempts_total{outcome=~"timeout|transport|upstream_5xx|stream_failed"}[10m])) / sum(increase(model_proxy_model_attempts_total[10m]))) > 0.5 and sum(increase(model_proxy_model_attempts_total[10m])) >= 5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: More than half of recent model attempts failed
          description: Over the last 10 minutes, more than half of at least 5 real model attempts failed on timeout, transport, upstream 5xx, or a broken stream. Idle (no attempts) does not fire. increase() survives a counter reset. See docs/TROUBLESHOOTING.md#model-proxy-connectivity.
