groups:
  - name: open-pr-review
    rules:
      - alert: OpenPrReviewWorkerDown
        # `absent` covers a Prometheus that never discovered a worker. When every worker stops, the
        # `worker` name stops resolving and Prometheus keeps the last targets at up == 0, so `max == 0` covers that.
        expr: absent(up{job="open-pr-review-worker"}) or max(up{job="open-pr-review-worker"}) == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: No worker is running
          description: No worker replica is discovered, or every known worker target is down (for example all workers stopped, DNS no longer resolves and Prometheus keeps the last target at up == 0). Reviews will queue and never run.

      - alert: OpenPrReviewWorkerTargetDown
        expr: up{job="open-pr-review-worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Worker metrics target unreachable
          description: A discovered worker replica cannot be scraped, which may mean lost review capacity; other replicas may still process reviews. Known limitation - a replica that stops drops out of Docker DNS discovery, so partial loss of replicas is not detected by this alert; use Docker/orchestrator desired-vs-running metrics for that (a queue-backlog alert is planned).

      - alert: OpenPrReviewApiDown
        expr: up{job="open-pr-review-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: API metrics endpoint is down

      - alert: OpenPrReviewCodexQuota
        expr: increase(open_pr_review_codex_attempts_total{result="CODEX_QUOTA"}[15m]) > 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: OpenAI quota exhausted
          description: Codex returned CODEX_QUOTA. Top up https://platform.openai.com/settings/organization/billing/ — reviews will keep failing.

      - alert: OpenPrReviewQueueNotDraining
        expr: open_pr_review_arq_queue_jobs > 0 and open_pr_review_review_in_flight{status="running"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Jobs queued but no worker is running them
          description: ARQ has waiting jobs and zero running review_runs. Check worker logs and `docker compose ps worker`.

      - alert: OpenPrReviewStaleReviews
        expr: open_pr_review_review_stale_in_flight > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Review runs stuck in pending/running
          description: One or more review_runs have not updated for 15+ minutes. Worker crash, Codex hang, or dead ARQ job.
