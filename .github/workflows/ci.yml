name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest

  test-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: review_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/review_test
        run: >-
          python -m pytest -v -rs
          tests/test_migration_005.py
          tests/test_migration_006.py
          tests/test_migration_007.py
          tests/test_cross_owner_db.py
          tests/test_owner_integrations_db.py
          tests/test_owner_policies_db.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          cp config.example.yaml config.yaml
          POSTGRES_PASSWORD=ci-build-only docker compose build
