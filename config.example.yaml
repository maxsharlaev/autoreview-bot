github:
  app_id: 0
  installation_id: 0
  # Required for production: configure an explicit allowlist. An empty list accepts
  # any repository (a startup warning is logged).
  allowed_repos:
    - example-org/example-repo
    # - example-org/another-repo

jira:
  base_url: https://example.atlassian.net
  email: ai-review@example.com
  projects:
    ABC:
      rework_status: "In Progress"

slack:
  enabled: false
  channel: "#ai-review"

schedule:
  review_digest:
    enabled: true
    cron: "0 * * * *"

features:
  jira_comment: true
  jira_transition: true
  digest_enabled: true

language:
  summary: en
  details: en

pr_description:
  enabled: false
  mode: comment # comment | fill_empty | append
  title_mode: "off" # off | until_human_edit | when_invalid_or_inconsistent (quotes recommended)
  check_title_relevance: true # compare PR title with commit messages
  timeout_seconds: 180 # total budget after review publication
  max_commit_chars: 12000 # character budget for grouped commit subjects
  language: auto # auto or any BCP 47 language code; overrides legacy pr_text.language
  prompt_file: "" # optional: prompts/local/pr_description.md

size_guard:
  soft:
    commits: 50
    changed_lines: 5000
  hard:
    commits: 150
    changed_lines: 20000
  override_label: autoreview:force

public_repos:
  jira_disclosure: key_only # none | key_only | full
  security_findings: redact # redact | full

codex:
  model: gpt-5.6-sol
  prompt_file: "" # optional: prompts/local/review.md (relative to the service working directory)
  reasoning_effort: medium
  sandbox: read-only
  approval_policy: never
  timeout_seconds: 600
  max_files: 100
  max_diff_lines: 20000
  max_findings: 20
  max_file_bytes: 524288

# Multiple owners (optional). When switching from legacy env credentials to an
# owners block only, put `aliases: [default]` on the owner that should keep the
# pre-multi-owner history; `default: true` alone does not carry it over.
# owners:
#   example-org:
#     default: true
#     aliases: [default]
#     github:
#       auth: pat
