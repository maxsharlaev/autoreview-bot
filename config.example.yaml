# Sample config.yaml. Every key, type, default and per-owner override:
# docs/CONFIGURATION.md. Secrets never go here; they live in .env (docs/ENVIRONMENT.md).
# Restart the API and worker after changes.

github:
  # Not used for credentials; set GITHUB_APP_ID / GITHUB_INSTALLATION_ID in .env.
  app_id: 0
  installation_id: 0
  # Required for production: configure an explicit allowlist. An empty list accepts
  # any repository (a startup warning is logged).
  allowed_repos:
    - example-org/example-repo
    # - example-org/another-repo

# Jira (credentials in .env). Turn off features.jira_* when Jira is not used.
jira:
  base_url: https://example.atlassian.net
  email: ai-review@example.com
  projects:
    ABC:
      rework_status: "In Progress"

slack:
  enabled: false
  channel: "#ai-review"

schedule:
  review_digest:
    enabled: true
    cron: "0 * * * *" # only numeric minute/hour fields; see docs/CONFIGURATION.md#schedule

features:
  jira_comment: true
  jira_transition: true
  digest_enabled: true

language: # en | ru
  summary: en
  details: en

# docs/PR_DESCRIPTION.md
pr_description:
  enabled: false
  mode: comment # comment | fill_empty | append
  title_mode: "off" # off | until_human_edit | when_invalid_or_inconsistent (quotes recommended)
  check_title_relevance: true # compare PR title with commit messages
  timeout_seconds: 180 # total budget after review publication
  max_commit_chars: 12000 # character budget for grouped commit subjects
  language: auto # auto or any BCP 47 language code; overrides legacy pr_text.language
  prompt_file: "" # optional: prompts/local/pr_description.md

size_guard:
  soft:
    commits: 50
    changed_lines: 5000
  hard:
    commits: 150
    changed_lines: 20000
  override_label: autoreview:force

# docs/PUBLIC_DISCLOSURE.md
public_repos:
  jira_disclosure: key_only # none | key_only | full
  security_findings: redact # redact | redact_all | full

# Progress on the PR head commit (docs/PROGRESS_STATUS.md). Best effort: without the permission the review still runs.
# GitHub App: check run "autoreview", needs Checks: Read and write.
# PAT: commit status "autoreview", needs Commit statuses: Read and write (classic PAT: repo:status).
progress_status:
  enabled: true
  mode: auto # auto | check_run | commit_status | off (auto = check_run for an App, commit_status for a PAT)
  reaction: false # eyes reaction on the PR while a worker reviews it
  timeout_seconds: 5 # per GitHub call

codex:
  # in_process (default) or container (needs launcher + LAUNCHER_TOKEN)
  runner_backend: in_process
  model: gpt-5.6-sol
  prompt_file: "" # optional: prompts/local/review.md (relative to the service working directory)
  reasoning_effort: medium
  sandbox: read-only
  approval_policy: never
  timeout_seconds: 600
  max_files: 100
  max_diff_lines: 20000
  max_findings: 20
  max_file_bytes: 524288

# Multiple owners (optional). Without this block the service runs exactly as a
# single owner ('default', built from the env and the sections above). See
# docs/MULTI_OWNER.md for modes A-D, routing and upgrade/rollback.
#
# routing:
#   unclaimed: default # default | reject: repos no owner claims go to the default owner or are rejected
#
# owners:
#   example-org:
#     default: true            # routing fallback in modes C/D (or over 'default' in mode B)
#     # When switching from legacy env credentials to an owners block only, put
#     # `aliases: [default]` on the owner that should keep the pre-multi-owner
#     # history; `default: true` alone does not carry it over.
#     aliases: [default]
#     github:
#       auth: app              # app | pat
#       app_id: 123456         # or app_id_env; default env OWNER_EXAMPLE_ORG_GITHUB_APP_ID
#       private_key_env: OWNER_EXAMPLE_ORG_GITHUB_APP_PRIVATE_KEY # or private_key_file
#       installation_id: 0     # 0: taken from the webhook payload / looked up
#       webhook_secret_env: OWNER_EXAMPLE_ORG_GITHUB_WEBHOOK_SECRET
#       allowed_repos: [example-org/*]   # exact org/repo or org/* wildcard
#     api:
#       key_env: OWNER_EXAMPLE_ORG_REVIEW_API_KEY # optional API key scoped to this owner
#     # Integrations are per owner and never inherited; omit a block to disable it.
